<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title desc">
<title id="title">ScaleOps logo mark</title><desc id="desc">Blue faceted ScaleOps S mark from the brand system.</desc>
<defs>
  <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#75ddff"/><stop offset=".24" stop-color="#42b8ff"/><stop offset=".58" stop-color="#2f80ed"/><stop offset="1" stop-color="#173d9f"/></linearGradient>
  <linearGradient id="gMid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#55c8ff"/><stop offset=".48" stop-color="#2b7bf3"/><stop offset="1" stop-color="#2038a4"/></linearGradient>
  <linearGradient id="gLow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2bb7ff"/><stop offset=".45" stop-color="#1c6ff0"/><stop offset="1" stop-color="#162d80"/></linearGradient>
