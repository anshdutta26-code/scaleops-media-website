<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="ScaleOps futuristic blue S graphic">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020712"/><stop offset=".52" stop-color="#050b18"/><stop offset="1" stop-color="#01040b"/>
    </linearGradient>
    <linearGradient id="ribbon" x1=".1" y1="0" x2=".9" y2="1">
