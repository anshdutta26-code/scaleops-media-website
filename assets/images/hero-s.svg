<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020712"/><stop offset="1" stop-color="#03112b"/></linearGradient>
  <linearGradient id="sTop" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#7ce7ff"/><stop offset=".28" stop-color="#249cff"/><stop offset=".67" stop-color="#2263f2"/><stop offset="1" stop-color="#7657ff"/></linearGradient>
  <linearGradient id="sSide" x1="0" x2="1"><stop stop-color="#0f4dc8"/><stop offset="1" stop-color="#2336a8"/></linearGradient>
  <linearGradient id="tower" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a2a62"/><stop offset="1" stop-color="#03132f"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#238eff" stop-opacity=".62"/><stop offset=".35" stop-color="#1756e8" stop-opacity=".2"/><stop offset="1" stop-color="#061329" stop-opacity="0"/></radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="smallGlow"><feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#33a9ff" flood-opacity=".72"/></filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#2a77e6" stroke-opacity=".08"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
