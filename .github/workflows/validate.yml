name: Validate ScaleOps site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check production files
        run: |
          set -e
          test -f index.html
          test -f contact/index.html
          test -f thanks/index.html
          test -f assets/images/scaleops-mark-exact.png
          test -f assets/images/logo-mark.svg
          test -f assets/css/immersive-webgl.css
          test -f assets/js/immersive-webgl.js
          test -f assets/js/contact-immersive.js
      - name: Check exact brandbook asset contract
        run: |
          set -e
          file assets/images/scaleops-mark-exact.png | grep -q 'PNG image data'
          grep -q 'scaleops-mark-exact.png' assets/images/logo-mark.svg
          grep -q 'scaleops-mark-exact.png' index.html
          ! grep -q 'data:image/' assets/images/logo-mark.svg
      - name: Check real WebGL immersive contract
        run: |
          set -e
          grep -q '<canvas id="webgl"' index.html
          grep -q 'type="module" src="assets/js/immersive-webgl.js' index.html
          grep -q 'three@0.180.0' assets/js/immersive-webgl.js
          grep -q 'WebGLRenderer' assets/js/immersive-webgl.js
          grep -q 'CylinderGeometry' assets/js/immersive-webgl.js
          grep -q 'createFunnelSegment' assets/js/immersive-webgl.js
          grep -q 'makeRupee' assets/js/immersive-webgl.js
          grep -q 'data-scene="logo"' index.html
          grep -q 'data-scene="orbit"' index.html
          grep -q 'data-scene="rupee"' index.html
          grep -q 'data-scene="funnel"' index.html
          grep -q 'data-scene="systems"' index.html
          grep -q 'data-scene="services"' index.html
          grep -q 'data-scene="proof"' index.html
          grep -q 'data-scene="insights"' index.html
          grep -q 'data-scene="return"' index.html
          grep -q 'data-scene="final"' index.html
      - name: Check responsive contract
        run: |
          set -e
          grep -q '@media (max-width:900px)' assets/css/immersive-webgl.css
          grep -q '@media (max-width:600px)' assets/css/immersive-webgl.css
          grep -q 'svh' assets/css/immersive-webgl.css
          grep -q 'devicePixelRatio' assets/js/immersive-webgl.js
      - name: Check booking backend contract
        run: |
          set -e
          grep -q 'https://formsubmit.co/anshdutta26@gmail.com' contact/index.html
          grep -q 'New ScaleOps Media Website Lead' contact/index.html
          grep -q 'value="12 PM"' contact/index.html
          grep -q 'value="1 PM"' contact/index.html
          grep -q 'value="2 PM"' contact/index.html
          grep -q 'value="3 PM"' contact/index.html
          grep -q 'value="4 PM"' contact/index.html
          grep -q 'value="Flexible"' contact/index.html
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/immersive-webgl.js
          node --check assets/js/contact-immersive.js
      - name: Check obvious placeholders
        run: |
          ! grep -R -n -E "YOUR DATA|YOUR %|YOUR X|example.com|To be added|Calendar placeholder" --include='*.html' .
