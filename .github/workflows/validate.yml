name: Validate ScaleOps site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check production files
        run: |
          set -e
          test -f index.html
          test -f contact/index.html
          test -f thanks/index.html
          test -f v7-preview/final.css
          test -f v7-preview/app-final.js
          test -f v7-preview/logo-data.js
          for i in 0 1 2 3 4 5 6; do test -f "v7-preview/logo/chunk${i}.js"; done
          test -f assets/js/contact-immersive.js
      - name: Check approved logo contract
        run: |
          set -e
          grep -q 'js-scaleops-logo' index.html
          grep -q 'js-scaleops-logo' contact/index.html
          grep -q 'js-scaleops-logo' thanks/index.html
          grep -q 'LOGO_URI' v7-preview/logo-data.js
          grep -q "data:image/png;base64," v7-preview/logo-data.js
          grep -q 'LOGO_ASPECT' v7-preview/app-final.js
          ! grep -q 'scaleops-mark-brandbook.svg' index.html
          ! grep -q 'assets/scaleops-mark.png' index.html
      - name: Check cinematic WebGL V7 contract
        run: |
          set -e
          grep -q '<canvas id="webgl"' index.html
          grep -q 'type="importmap"' index.html
          grep -q 'app-final.js' index.html
          grep -q 'EffectComposer' v7-preview/app-final.js
          grep -q 'UnrealBloomPass' v7-preview/app-final.js
          grep -q 'ExtrudeGeometry' v7-preview/app-final.js
          grep -q 'makeFunnelWalls' v7-preview/app-final.js
          grep -q 'makeLogo' v7-preview/app-final.js
          grep -q 'makeRupee' v7-preview/app-final.js
          grep -q 'CatmullRomCurve3' v7-preview/app-final.js
          grep -q 'inner = 6.25' v7-preview/app-final.js
          grep -q 'Acquire' index.html
          grep -q 'Convert' index.html
          grep -q 'Retain' index.html
          grep -q 'Operate' index.html
          grep -q 'Scale' index.html
      - name: Check responsive contract
        run: |
          set -e
          grep -q '@media(max-width:900px)' v7-preview/final.css
          grep -q '@media(max-width:600px)' v7-preview/final.css
          grep -q 'svh' v7-preview/final.css
          grep -q 'devicePixelRatio' v7-preview/app-final.js
          grep -q 'isMobile' v7-preview/app-final.js
          grep -q 'isTablet' v7-preview/app-final.js
      - name: Check booking backend contract
        run: |
          set -e
          grep -q 'https://formsubmit.co/anshdutta26@gmail.com' contact/index.html
          grep -q 'New ScaleOps Media Website Lead' contact/index.html
          grep -q 'value="12 PM"' contact/index.html
          grep -q 'value="1 PM"' contact/index.html
          grep -q 'value="2 PM"' contact/index.html
          grep -q 'value="3 PM"' contact/index.html
          grep -q 'value="4 PM"' contact/index.html
          grep -q 'value="Flexible"' contact/index.html
      - name: Check JavaScript syntax
        run: |
          node --check v7-preview/app-final.js
          node --check v7-preview/logo-data.js
          node --check assets/js/contact-immersive.js
      - name: Check obvious placeholders
        run: |
          ! grep -R -n -E "YOUR DATA|YOUR %|YOUR X|example.com|To be added|Calendar placeholder" --include='*.html' .
