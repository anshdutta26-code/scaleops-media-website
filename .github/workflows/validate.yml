name: Validate ScaleOps site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check production files
        run: |
          set -e
          test -f index.html
          test -f contact/index.html
          test -f thanks/index.html
          test -f assets/images/scaleops-mark-brandbook.svg
          test -f assets/css/immersive-v6.css
          test -f assets/js/immersive-v6.js
          test -f assets/js/immersive-v6-loader.js
          test -f assets/js/contact-immersive.js
      - name: Check exact brandbook asset contract
        run: |
          set -e
          grep -q 'viewBox="0 0 661 433"' assets/images/scaleops-mark-brandbook.svg
          grep -q 'data:image/png;base64,' assets/images/scaleops-mark-brandbook.svg
          grep -q 'scaleops-mark-brandbook.svg' index.html
          grep -q 'scaleops-mark-brandbook.svg' assets/js/immersive-v6-loader.js
      - name: Check cinematic WebGL V6 contract
        run: |
          set -e
          grep -q '<canvas id="webgl"' index.html
          grep -q 'type="importmap"' index.html
          grep -q 'immersive-v6-loader.js' index.html
          grep -q 'EffectComposer' assets/js/immersive-v6.js
          grep -q 'UnrealBloomPass' assets/js/immersive-v6.js
          grep -q 'ExtrudeGeometry' assets/js/immersive-v6.js
          grep -q 'makeFunnelWalls' assets/js/immersive-v6.js
          grep -q 'makeLogo3D' assets/js/immersive-v6.js
          grep -q 'makeRupee' assets/js/immersive-v6.js
          grep -q 'splineOffset' assets/js/immersive-v6.js
          grep -q 'data-scene="logo"' index.html
          grep -q 'data-scene="orbit"' index.html
          grep -q 'data-scene="rupee"' index.html
          grep -q 'data-scene="funnel"' index.html
          grep -q 'data-scene="systems"' index.html
          grep -q 'data-scene="services"' index.html
          grep -q 'data-scene="proof"' index.html
          grep -q 'data-scene="insights"' index.html
          grep -q 'data-scene="return"' index.html
          grep -q 'data-scene="final"' index.html
      - name: Check responsive contract
        run: |
          set -e
          grep -q '@media(max-width:1050px)' assets/css/immersive-v6.css
          grep -q '@media(max-width:600px)' assets/css/immersive-v6.css
          grep -q 'svh' assets/css/immersive-v6.css
          grep -q 'devicePixelRatio' assets/js/immersive-v6.js
          grep -q 'isMobile' assets/js/immersive-v6.js
          grep -q 'isTablet' assets/js/immersive-v6.js
      - name: Check booking backend contract
        run: |
          set -e
          grep -q 'https://formsubmit.co/anshdutta26@gmail.com' contact/index.html
          grep -q 'New ScaleOps Media Website Lead' contact/index.html
          grep -q 'value="12 PM"' contact/index.html
          grep -q 'value="1 PM"' contact/index.html
          grep -q 'value="2 PM"' contact/index.html
          grep -q 'value="3 PM"' contact/index.html
          grep -q 'value="4 PM"' contact/index.html
          grep -q 'value="Flexible"' contact/index.html
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/immersive-v6.js
          node --check assets/js/immersive-v6-loader.js
          node --check assets/js/contact-immersive.js
      - name: Check obvious placeholders
        run: |
          ! grep -R -n -E "YOUR DATA|YOUR %|YOUR X|example.com|To be added|Calendar placeholder" --include='*.html' .
