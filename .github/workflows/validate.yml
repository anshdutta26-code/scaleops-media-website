name: Validate ScaleOps site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check required production files
        run: |
          set -e
          test -f index.html
          test -f contact/index.html
          test -f thanks/index.html
          test -f assets/images/logo-mark.svg
          test -f assets/images/logo-lockup.svg
          test -f assets/css/approved-immersive-3d.css
          test -f assets/css/orbit-final.css
          test -f assets/css/experience-v2.css
          test -f assets/js/approved-immersive-3d.js
      - name: Check brand assets are self contained
        run: |
          set -e
          grep -q '<svg' assets/images/logo-mark.svg
          grep -q '<path' assets/images/logo-mark.svg
          grep -q '<svg' assets/images/logo-lockup.svg
          ! grep -q 'data:image/' assets/images/logo-mark.svg
          ! grep -q 'data:image/' assets/images/logo-lockup.svg
      - name: Check immersive design contract
        run: |
          set -e
          grep -q 'data-scene="logo"' index.html
          grep -q 'data-scene="rupee"' index.html
          grep -q 'data-scene="hub"' index.html
          grep -q 'data-scene="services"' index.html
          grep -q 'data-scene="proof"' index.html
          grep -q 'data-scene="insights"' index.html
          grep -q 'data-scene="return"' index.html
          grep -q 'data-scene="final"' index.html
          grep -q 'stage-fx' assets/js/approved-immersive-3d.js
          grep -q 'transition' assets/js/approved-immersive-3d.js
          grep -q 'process' assets/js/approved-immersive-3d.js
          grep -q 'Protected three-column composition' assets/css/orbit-final.css
          ! grep -q -- '--stage-w' assets/css/experience-v2.css
      - name: Check lead booking contract
        run: |
          set -e
          grep -q 'New ScaleOps Media Website Lead' contact/index.html
          grep -q 'value="12 PM"' contact/index.html
          grep -q 'value="1 PM"' contact/index.html
          grep -q 'value="2 PM"' contact/index.html
          grep -q 'value="3 PM"' contact/index.html
          grep -q 'value="4 PM"' contact/index.html
          grep -q 'value="Flexible"' contact/index.html
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/approved-immersive-3d.js
          node --check assets/js/contact-immersive.js
      - name: Check obvious placeholders
        run: |
          ! grep -R -n -E "YOUR DATA|YOUR %|YOUR X|example.com|To be added|Calendar placeholder" --include='*.html' .
