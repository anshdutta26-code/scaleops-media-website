name: Validate ScaleOps V7 preview
on:
  push:
    branches: [main]
    paths:
      - 'v7-preview/**'
      - '.github/workflows/validate-v7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-v7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check final V7 assets
        run: |
          set -e
          test -f v7-preview/index.html
          test -f v7-preview/final.css
          test -f v7-preview/app-final.js
          test -f v7-preview/logo-data.js
          for i in 0 1 2 3 4 5 6; do test -f "v7-preview/logo/chunk${i}.js"; done
      - name: Check approved logo delivery
        run: |
          set -e
          grep -q 'LOGO_URI' v7-preview/logo-data.js
          grep -q 'LOGO_ASPECT' v7-preview/logo-data.js
          grep -q "data:image/png;base64," v7-preview/logo-data.js
          grep -q 'class="js-scaleops-logo"' v7-preview/index.html
          grep -q 'id="logo-overlay"' v7-preview/index.html
          grep -q "LOGO_URI" v7-preview/app-final.js
          grep -q 'depthTest: false' v7-preview/app-final.js
          grep -q 'depthWrite: false' v7-preview/app-final.js
          ! grep -q 'assets/scaleops-mark.png' v7-preview/index.html
          ! grep -q 'scaleops-mark-brandbook.svg' v7-preview/index.html
      - name: Check cinematic V7 contract
        run: |
          set -e
          grep -q 'EffectComposer' v7-preview/app-final.js
          grep -q 'UnrealBloomPass' v7-preview/app-final.js
          grep -q 'CatmullRomCurve3' v7-preview/app-final.js
          grep -q 'ExtrudeGeometry' v7-preview/app-final.js
          grep -q 'makeFunnelWalls' v7-preview/app-final.js
          grep -q 'inner = 6.25' v7-preview/app-final.js
          grep -q 'Acquire' v7-preview/index.html
          grep -q 'Convert' v7-preview/index.html
          grep -q 'Retain' v7-preview/index.html
          grep -q 'Operate' v7-preview/index.html
          grep -q 'Scale' v7-preview/index.html
      - name: Check responsive contract
        run: |
          set -e
          grep -q '@media(max-width:900px)' v7-preview/final.css
          grep -q '@media(max-width:600px)' v7-preview/final.css
          grep -q 'devicePixelRatio' v7-preview/app-final.js
          grep -q 'isMobile' v7-preview/app-final.js
          grep -q 'isTablet' v7-preview/app-final.js
      - name: Check JavaScript syntax
        run: |
          node --check v7-preview/app-final.js
          node --check v7-preview/logo-data.js
